name: Android APK

on:
  push:
    branches: [main, "arena/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Native TCP-UDP tests and signed APK
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GOMAXPROCS: "2"
      WOT_CONFIG_FIXTURES: ${{ github.workspace }}/.work/fixtures
      HEV_TEST_LIBRARY: ${{ github.workspace }}/.work/hev/bin/libhev-socks5-tunnel.so
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.27.3"
          cache-dependency-path: native/xray/go.sum
      - name: Resolve native module checksums and format Go sources
        working-directory: native/xray
        run: |
          source ../versions.env
          ../ci-run.sh go-version go get "github.com/xtls/xray-core@$XRAY_COMMIT"
          ../ci-run.sh go-modules go mod tidy
          gofmt -w .
          go mod verify
          python3 ../publish-lock.py
      - name: Install pinned SDK and NDK
        run: native/ci-run.sh sdk native/install-sdk.sh
      - name: Set up Gradle and validate wrapper
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - name: Build Go-JNI and NDK libraries for all supported ABIs
        run: native/ci-run.sh android-native native/build-android.sh
      - name: Unit tests, link compiler fixtures and Android lint
        run: native/ci-run.sh kotlin ./gradlew --no-daemon testDebugUnitTest lintRelease
      - name: Build native Linux test library
        run: native/ci-run.sh linux-native make -C .work/hev shared -j2
      - name: End-to-end TCP and UDP packet tests
        working-directory: native/xray
        run: |
          sudo sysctl -w net.ipv4.ip_unprivileged_port_start=0
          ../ci-run.sh native-tests go test -mod=readonly -p 2 -timeout 180s -v ./engine
      - name: Build release APK with personal debug signing
        run: native/ci-run.sh apk ./gradlew --no-daemon assembleRelease
      - name: Verify signature and 16 KiB native ZIP alignment
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -P 16 4 app/build/outputs/apk/release/app-release.apk
      - name: Upload APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: WoT-Blitz-VPN-${{ github.run_number }}
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-reports-${{ github.run_number }}
          path: app/build/reports/
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload native source lock
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-source-lock
          path: |
            native/xray/go.mod
            native/xray/go.sum
            native/xray/*.go
            native/xray/engine/*.go
          retention-days: 14
